name: droidian rootfs-builder

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to a GitHub release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rootfs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  prepare:
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    name: Create GitHub release
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up some storage
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Nightly tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly --target "$GITHUB_SHA" --prerelease

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: droidian-out-*
          path: droidian-out

      - name: Create SHA256SUMS
        run: |
          set -e
          cd droidian-out
          for x in droidian-out-*; do
            (cd "$x" && sha256sum -- * >> ../SHA256SUMS)
          done

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/droidian')
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/SHA256SUMS
          tag_name: nightly
          draft: false
          prerelease: true

  publish:
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs: [build, prepare]

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.build.outputs.matrix) }}

    name: Publish ${{ matrix.config.job_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidian-out-${{ matrix.config.product }}-${{ matrix.config.arch }}-${{ matrix.config.edition }}-${{ matrix.config.variant }}-${{ matrix.config.apilevel }}
          path: droidian-out

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/droidian')
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/droidian') != true
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: droidian-out/*
          tag_name: nightly
          draft: false
          prerelease: true
